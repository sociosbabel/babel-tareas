<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BABEL - Tareas y Objetivos Socios</title>
<style>
:root{
  --bg:#FAF9F6;--bg2:#F2F0EB;--border:#E0DDD6;
  --text:#1A1916;--text2:#6B6860;--text3:#A8A59F;
  --green:#3B6D11;--red:#A32D2D;--orange:#BA7517;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}

.header{background:var(--bg);border-bottom:1px solid var(--border);padding:12px 20px 0;position:sticky;top:0;z-index:20}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.logo{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;flex:1}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;transition:background .3s}
.sync-dot.syncing{background:var(--orange)}.sync-dot.err{background:var(--red)}
.sync-label{font-size:11px;color:var(--text3)}
.prog-bar{background:var(--border);border-radius:100px;height:2px;overflow:hidden;margin-bottom:3px}
.prog-fill{background:var(--green);height:100%;border-radius:100px;transition:width .4s}
.prog-label{font-size:11px;color:var(--text3);margin-bottom:8px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border)}
.tab{font-size:12px;font-weight:500;padding:8px 16px;cursor:pointer;border-bottom:2px solid transparent;color:var(--text2);white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;transition:all .15s}
.tab.on{color:var(--text);border-bottom-color:var(--text)}

/* Search */
.search-bar-wrap{padding:8px 20px;border-bottom:1px solid var(--border)}
.search-inner{position:relative;width:260px;max-width:100%}
.search-inner input{width:100%;font-size:13px;padding:6px 28px 6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.search-inner input:focus{outline:none;border-color:var(--text3)}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:13px;color:var(--text3);display:none;line-height:1;padding:0}

/* Filters */
.filter-row{display:flex;gap:5px;padding:8px 20px;overflow-x:auto;border-bottom:1px solid var(--border);scrollbar-width:none;align-items:center}
.filter-row::-webkit-scrollbar{display:none}
.fbtn{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .15s}
.fbtn.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.sep{width:1px;height:16px;background:var(--border);flex-shrink:0;margin:0 2px}

/* Add row */
.add-row{padding:10px 20px;border-bottom:1px solid var(--border)}
.add-row-top{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.add-input{flex:1;min-width:140px;font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.add-input:focus{outline:none;border-color:var(--text3)}
.add-sel{font-size:12px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer}
.add-row-bottom{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inmediata-wrap{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text2);cursor:pointer}
.inmediata-wrap input{accent-color:var(--orange);width:14px;height:14px;cursor:pointer}
.date-label{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px}
.date-input{font-size:12px;padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.date-input:focus{outline:none;border-color:var(--text3)}
.btn-add{font-size:12px;padding:7px 14px;border-radius:8px;border:none;background:var(--text);color:var(--bg);cursor:pointer;font-weight:500;white-space:nowrap}
.btn-add:hover{opacity:.85}
.add-cats-btn{font-size:11px;padding:3px 10px;border-radius:20px;border:1px dashed var(--border);background:transparent;color:var(--text2);cursor:pointer}

/* Tasks */
.task-list{list-style:none;padding:8px 20px 80px}
.task-item{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;background:var(--bg);cursor:grab;user-select:none;transition:background .12s}
.task-item:hover{background:var(--bg2)}
.task-item.dragging{opacity:.3}
.task-item.drag-over{border-color:var(--green);border-width:2px}
.task-item.done{background:var(--bg2)}
.task-item.done .task-text{text-decoration:line-through;color:var(--text3)}
.task-item.overdue{border-left:3px solid var(--red)}
.task-item.inmediata-item{border-left:3px solid var(--orange)}
.handle{color:var(--text3);font-size:14px;cursor:grab;flex-shrink:0;margin-top:3px}
.task-num{font-size:11px;color:var(--text3);width:20px;text-align:right;flex-shrink:0;margin-top:4px}
.cb{width:15px;height:15px;cursor:pointer;flex-shrink:0;margin-top:3px;accent-color:var(--green)}
.task-body{flex:1;min-width:0}
.task-meta{display:flex;gap:5px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.cat-badge{font-size:10px;font-weight:500;padding:2px 8px;border-radius:20px;cursor:pointer;flex-shrink:0;white-space:nowrap}
.assign-badge{font-size:10px;font-weight:500;padding:2px 8px;border-radius:20px;cursor:pointer;flex-shrink:0;white-space:nowrap;border:1px solid var(--border)}
.assign-none{background:var(--bg2);color:var(--text2)}
.assign-g{background:#E6F1FB;color:#0C447C}
.assign-v{background:#FBEAF0;color:#72243E}
.assign-both{background:#EAF3DE;color:#27500A}
.inmediata-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:#FEF3DB;color:var(--orange);flex-shrink:0}
.date-badge{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--bg2);color:var(--text2);flex-shrink:0}
.date-badge.overdue{background:#FDEAEA;color:var(--red);font-weight:500}
.adjunto-badge{font-size:10px;padding:2px 6px;border-radius:20px;background:#FEF3DB;color:#633806;font-weight:500;flex-shrink:0}
.task-text{font-size:13px;line-height:1.45;color:var(--text)}
.task-notes{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.4;cursor:text;min-height:16px;border-radius:4px;padding:2px 4px;margin-left:-4px;border:1px solid transparent}
.task-notes:empty::before{content:'Agregar observación...';color:var(--text3)}
.task-notes:hover{border-color:var(--border)}
.task-notes:focus{outline:none;border-color:var(--text3);background:var(--bg)}
.task-attach{display:block;margin-top:6px;text-decoration:none}
.task-attach img{max-width:100%;max-height:100px;border-radius:6px;border:1px solid var(--border);display:block;margin-bottom:3px}
.task-attach span{font-size:11px;color:#0C447C;font-weight:500}
.icon-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:2px 4px;flex-shrink:0;opacity:0;transition:opacity .15s;margin-top:1px}
.task-item:hover .icon-btn{opacity:1}
.empty{text-align:center;color:var(--text3);font-size:13px;padding:2.5rem 0}

/* Done filters */
.done-filters{display:flex;gap:6px;padding:8px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.done-filters span{font-size:11px;color:var(--text2)}

/* Gantt */
.gantt-wrap{padding:12px 20px 80px;overflow-x:auto}
.gantt-table{min-width:700px}
.gantt-row{display:grid;grid-template-columns:220px 1fr;gap:8px;align-items:center;margin-bottom:6px;min-height:36px}
.gantt-label{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.gantt-label.overdue{color:var(--red)}
.gantt-bar-wrap{position:relative;height:24px;background:var(--bg2);border-radius:6px}
.gantt-bar{position:absolute;height:100%;border-radius:6px;min-width:6px}
.gantt-bar.inmediata{background:var(--orange);opacity:.75}
.gantt-bar.normal{background:var(--green);opacity:.7}
.gantt-bar.overdue{background:var(--red);opacity:.8}
.gantt-today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);opacity:.3;z-index:2}
.gantt-months{display:flex;border-bottom:1px solid var(--border);margin-bottom:8px;margin-left:228px}
.gantt-month{font-size:10px;color:var(--text3);text-align:center;flex-shrink:0}

/* Modals */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--bg);border-radius:14px;padding:22px;width:min(420px,92vw);max-height:85vh;overflow-y:auto;border:1px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,.12)}
.modal h3{font-size:15px;font-weight:600;margin-bottom:14px}
.mfield{margin-bottom:12px}
.mfield label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px}
.mfield input,.mfield select,.mfield textarea{width:100%;font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-family:var(--font)}
.mfield input:focus,.mfield select:focus,.mfield textarea:focus{outline:none;border-color:var(--text3)}
.mfield textarea{resize:vertical;min-height:60px}
.minmediata{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;margin-bottom:12px}
.minmediata input{accent-color:var(--orange);width:15px;height:15px}
.mactions{display:flex;gap:8px;margin-top:16px;justify-content:space-between;align-items:center}
.mactions-right{display:flex;gap:8px}
.btn-m{font-size:13px;padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer}
.btn-m.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-m.danger{color:var(--red);border-color:var(--red)}
.btn-m:hover{opacity:.85}
.cat-row-edit{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.cat-row-edit input[type=text]{flex:1;font-size:13px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.cat-row-edit input[type=color]{width:30px;height:30px;padding:2px;border:1px solid var(--border);border-radius:6px;cursor:pointer}
.btn-add-cat{font-size:12px;padding:6px 10px;border:1px dashed var(--border);border-radius:8px;background:transparent;color:var(--text2);cursor:pointer;width:100%;margin-top:4px}
</style>
</head>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyAZ25T-qhy-B_8M9QTCUh1dR18fiaPq0WQ",
  authDomain: "babel-tareas.firebaseapp.com",
  projectId: "babel-tareas",
  storageBucket: "babel-tareas.firebasestorage.app",
  messagingSenderId: "839198211706",
  appId: "1:839198211706:web:06623a6490bff1a3fe45c3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const MAIN_DOC = doc(db, 'babel', 'tareas');
const HISTORY_COL = collection(db, 'babel_historial');
const CLOUD_NAME = 'dmg4sk7k';
const UPLOAD_PRESET = 'babel_uploads';

const DEFAULT_CATS = [
  {id:'ops',label:'Ops',bg:'#dceefb',text:'#0C447C'},
  {id:'mkt',label:'Mkt',bg:'#fde8f0',text:'#72243E'},
  {id:'rrhh',label:'RRHH',bg:'#e2f5e9',text:'#27500A'},
  {id:'fin',label:'Fin',bg:'#fef3db',text:'#633806'},
  {id:'tech',label:'Tech',bg:'#ede9fb',text:'#3C3489'},
];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(d){if(!d)return'';const[y,m,day]=d.split('-');return`${day}/${m}/${y.slice(2)}`}

let tasks=[], cats=[], activeFilter='all', saving=false, lastSnapshot=null, editingId=null, activeTab='tareas', searchQuery='';
let pendingAttach=null; // adjunto pendiente al crear tarea

// ── Firebase ───────────────────────────────────────────────────────────────
async function saveData(desc){
  if(saving)return; saving=true;
  setSyncState('syncing','guardando...');
  try{
    const payload={tasks,cats,updatedAt:new Date().toISOString()};
    await setDoc(MAIN_DOC,payload);
    await addDoc(HISTORY_COL,{...payload,cambio:desc||'actualización',fecha:serverTimestamp()});
    lastSnapshot=JSON.stringify({tasks,cats});
    setSyncState('ok','sincronizado');
  }catch(e){setSyncState('err','error al guardar');console.error(e);}
  finally{saving=false;}
}

onSnapshot(MAIN_DOC,snap=>{
  if(!snap.exists()){
    cats=DEFAULT_CATS.map(c=>({...c}));
    tasks=[];
    saveData('carga inicial'); renderAll(); return;
  }
  const data=snap.data();
  let migrated=false;
  (data.tasks||[]).forEach(t=>{
    if(t.inmediata===undefined&&!t.fechaLimite){t.inmediata=true;migrated=true;}
    if(!t.fechaInicio)t.fechaInicio=today();
  });
  const incoming=JSON.stringify({tasks:data.tasks,cats:data.cats});
  if(incoming===lastSnapshot&&!migrated)return;
  tasks=data.tasks||[];
  cats=data.cats||DEFAULT_CATS;
  lastSnapshot=JSON.stringify({tasks,cats});
  if(migrated)saveData('migración');
  setSyncState('ok','sincronizado');
  renderAll();
});

function setSyncState(s,l){
  document.getElementById('syncDot').className='sync-dot'+(s==='ok'?'':s==='syncing'?' syncing':' err');
  document.getElementById('syncLabel').textContent=l;
}

// ── Helpers ────────────────────────────────────────────────────────────────
function catById(id){return cats.find(c=>c.id===id)||cats[0]||DEFAULT_CATS[0];}
function assignInfo(a){
  if(!a||a==='')return{label:'Sin asignar',cls:'assign-none'};
  if(a==='g')return{label:'Gonzalo',cls:'assign-g'};
  if(a==='v')return{label:'Vito',cls:'assign-v'};
  return{label:'Ambos',cls:'assign-both'};
}
function nextAssign(a){
  if(!a||a==='')return'g';
  if(a==='g')return'v';
  if(a==='v')return'both';
  return'';
}
function isOverdue(t){return t.fechaLimite&&!t.done&&t.fechaLimite<today();}
function isImg(name){return name&&/\.(jpg|jpeg|png|gif|webp|heic|avif)$/i.test(name);}

function sortTasks(arr){
  return [...arr].sort((a,b)=>{
    if(a.inmediata&&!b.inmediata)return-1;
    if(!a.inmediata&&b.inmediata)return 1;
    if(a.fechaLimite&&b.fechaLimite)return a.fechaLimite.localeCompare(b.fechaLimite);
    if(a.fechaLimite&&!b.fechaLimite)return-1;
    if(!a.fechaLimite&&b.fechaLimite)return 1;
    return 0;
  });
}

function filteredTasks(){
  const q=searchQuery.toLowerCase().trim();
  return tasks.filter(t=>{
    if(t.done)return false;
    if(q&&!t.text.toLowerCase().includes(q)&&!(t.notes||'').toLowerCase().includes(q))return false;
    if(activeFilter==='all')return true;
    if(activeFilter==='overdue')return isOverdue(t);
    if(activeFilter==='g')return t.assign==='g';
    if(activeFilter==='v')return t.assign==='v';
    if(activeFilter==='both')return t.assign==='both';
    if(activeFilter==='none')return!t.assign||t.assign==='';
    if(activeFilter.startsWith('cat_'))return t.cat===activeFilter.slice(4);
    return true;
  });
}

// ── Cloudinary Upload ──────────────────────────────────────────────────────
async function uploadFile(file, onSuccess, onError, btnEl, nameEl){
  if(btnEl)btnEl.textContent='⏳ Subiendo...';
  try{
    const fd=new FormData();
    fd.append('file',file);
    fd.append('upload_preset',UPLOAD_PRESET);
    fd.append('folder','babel-tareas');
    const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`,{method:'POST',body:fd});
    const data=await res.json();
    if(data.secure_url){
      onSuccess({url:data.secure_url,name:file.name});
    } else {
      if(onError)onError();
      if(nameEl)nameEl.textContent='Error al subir';
    }
  }catch(e){
    if(onError)onError();
    if(nameEl)nameEl.textContent='Error de conexión';
    console.error(e);
  }
  if(btnEl)btnEl.textContent='📎 Adjuntar';
}

// ── Render ─────────────────────────────────────────────────────────────────
function renderFilters(){
  const row=document.getElementById('filterRow');row.innerHTML='';
  const overdueCount=tasks.filter(t=>!t.done&&isOverdue(t)).length;
  [{id:'all',label:'Todas'},{id:'overdue',label:`Vencidas${overdueCount?` (${overdueCount})`:''}`}].forEach(f=>{
    const b=document.createElement('button');
    b.className='fbtn'+(activeFilter===f.id?' on':'');
    b.textContent=f.label;
    if(f.id==='overdue'&&overdueCount&&activeFilter!==f.id)b.style.color='var(--red)';
    b.onclick=()=>{activeFilter=f.id;renderTasks();renderFilters();};
    row.appendChild(b);
  });
  const s1=document.createElement('div');s1.className='sep';row.appendChild(s1);
  [{id:'g',label:'Gonzalo'},{id:'v',label:'Vito'},{id:'both',label:'Ambos'},{id:'none',label:'Sin asignar'}].forEach(f=>{
    const b=document.createElement('button');
    b.className='fbtn'+(activeFilter===f.id?' on':'');
    b.textContent=f.label;
    b.onclick=()=>{activeFilter=f.id;renderTasks();renderFilters();};
    row.appendChild(b);
  });
  const s2=document.createElement('div');s2.className='sep';row.appendChild(s2);
  cats.forEach(c=>{
    const b=document.createElement('button');
    b.className='fbtn'+(activeFilter==='cat_'+c.id?' on':'');
    b.textContent=c.label;
    b.onclick=()=>{activeFilter='cat_'+c.id;renderTasks();renderFilters();};
    row.appendChild(b);
  });
}

function renderCatSelects(){
  const opts=cats.map(c=>`<option value="${c.id}">${c.label}</option>`).join('');
  document.getElementById('addCatSel').innerHTML=opts;
  document.getElementById('editCat').innerHTML=opts;
  const doneCat=document.getElementById('doneFilterCat');
  doneCat.innerHTML='<option value="">Todas las categorías</option>'+opts;
}

function makeTaskEl(task, idx, isDone){
  const c=catById(task.cat);
  const {label:al,cls:ac}=assignInfo(task.assign);
  const overdue=isOverdue(task);
  const li=document.createElement('li');
  li.className='task-item'+(isDone?' done':'')+(overdue?' overdue':'')+(task.inmediata&&!isDone?' inmediata-item':'');
  li.draggable=!isDone;
  li.dataset.id=task.id;

  // date badge
  let dateBadge='';
  if(task.inmediata&&!task.fechaLimite)dateBadge=`<span class="inmediata-badge">⚡ Inmediata</span>`;
  else if(task.inmediata&&task.fechaLimite)dateBadge=`<span class="inmediata-badge">⚡ Inmediata</span><span class="date-badge${overdue?' overdue':''}">Límite: ${fmtDate(task.fechaLimite)}</span>`;
  else if(task.fechaLimite)dateBadge=`<span class="date-badge${overdue?' overdue':''}">Límite: ${fmtDate(task.fechaLimite)}</span>`;

  const adjBadge=task.adjunto?'<span class="adjunto-badge">📎</span>':'';

  li.innerHTML=`
    <span class="handle">⠿</span>
    <span class="task-num">${idx+1}</span>
    <input type="checkbox" class="cb" ${isDone?'checked':''}>
    <div class="task-body">
      <div class="task-meta">
        ${adjBadge}
        <span class="cat-badge" style="background:${c.bg};color:${c.text}">${c.label}</span>
        <span class="assign-badge ${ac}">${al}</span>
        ${dateBadge}
      </div>
      <span class="task-text">${task.text}</span>
      <div class="task-notes" contenteditable="${isDone?'false':'true'}">${task.notes||''}</div>
      ${task.adjunto?`<a class="task-attach" href="${task.adjunto.url}" target="_blank">
        ${isImg(task.adjunto.name)?`<img src="${task.adjunto.url}" alt="${task.adjunto.name}">`:''}
        <span>📎 ${task.adjunto.name}</span>
      </a>`:''}
    </div>
    <button class="icon-btn edit-btn" title="Editar">✎</button>
  `;

  li.querySelector('.cb').addEventListener('change',e=>{
    task.done=e.target.checked;
    saveData((task.done?'completada':'reabierta')+': '+task.text);
    renderAll();
  });
  li.querySelector('.cat-badge').addEventListener('click',()=>{
    const idx=cats.findIndex(c=>c.id===task.cat);
    task.cat=cats[(idx+1)%cats.length].id;
    saveData('categoría: '+task.text);renderAll();
  });
  li.querySelector('.assign-badge').addEventListener('click',()=>{
    task.assign=nextAssign(task.assign);
    saveData('asignación: '+task.text);renderAll();
  });
  li.querySelector('.edit-btn').addEventListener('click',e=>{
    e.stopPropagation();openEditModal(task);
  });

  if(!isDone){
    const notesEl=li.querySelector('.task-notes');
    notesEl.addEventListener('blur',e=>{
      const val=e.target.innerText.trim();
      if(val!==task.notes){task.notes=val;saveData('observación: '+task.text);}
    });
    notesEl.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();e.target.blur();}
    });
    addDragEvents(li,task);
    addTouchEvents(li,task);
  }
  return li;
}

function renderTasks(){
  const list=document.getElementById('taskList');
  const vis=sortTasks(filteredTasks());
  list.innerHTML='';
  if(!vis.length){list.innerHTML='<li class="empty">Sin tareas en esta vista.</li>';updateProgress();return;}
  vis.forEach((t,i)=>list.appendChild(makeTaskEl(t,i,false)));
  updateProgress();
}

function renderDone(){
  const list=document.getElementById('doneList');
  const catF=document.getElementById('doneFilterCat').value;
  const assignF=document.getElementById('doneFilterAssign').value;
  const sort=document.getElementById('doneSortBy').value;
  let done=tasks.filter(t=>t.done);
  if(catF)done=done.filter(t=>t.cat===catF);
  if(assignF==='none')done=done.filter(t=>!t.assign||t.assign==='');
  else if(assignF)done=done.filter(t=>t.assign===assignF);
  if(sort==='limit_asc')done.sort((a,b)=>(a.fechaLimite||'').localeCompare(b.fechaLimite||''));
  else if(sort==='limit_desc')done.sort((a,b)=>(b.fechaLimite||'').localeCompare(a.fechaLimite||''));
  else if(sort==='name')done.sort((a,b)=>a.text.localeCompare(b.text));
  else if(sort==='oldest')done.reverse();
  list.innerHTML='';
  if(!done.length){list.innerHTML='<li class="empty">No hay tareas ejecutadas con estos filtros.</li>';return;}
  done.forEach((t,i)=>list.appendChild(makeTaskEl(t,i,true)));
}

function renderGantt(){
  const wrap=document.getElementById('ganttWrap');
  const active=tasks.filter(t=>!t.done);
  if(!active.length){wrap.innerHTML='<p class="empty">Sin tareas para mostrar.</p>';return;}
  const todayStr=today();
  let minDate=todayStr,maxDate=todayStr;
  active.forEach(t=>{
    if(t.fechaInicio&&t.fechaInicio<minDate)minDate=t.fechaInicio;
    if(t.fechaLimite&&t.fechaLimite>maxDate)maxDate=t.fechaLimite;
  });
  const minD=new Date(minDate);minD.setDate(minD.getDate()-3);
  const maxD=new Date(maxDate);maxD.setDate(maxD.getDate()+7);
  const totalDays=Math.max((maxD-minD)/86400000,30);
  function pct(d){if(!d)return 0;return Math.max(0,Math.min(100,((new Date(d)-minD)/86400000)/totalDays*100));}
  const todayPct=pct(todayStr);
  let monthsHtml='';
  const cur=new Date(minD);
  while(cur<=maxD){
    const daysInView=Math.min((new Date(cur.getFullYear(),cur.getMonth()+1,1)-cur)/86400000,(maxD-cur)/86400000+1);
    const w=(daysInView/totalDays*100).toFixed(1);
    monthsHtml+=`<div class="gantt-month" style="width:${w}%">${cur.toLocaleDateString('es',{month:'short',year:'2-digit'})}</div>`;
    cur.setMonth(cur.getMonth()+1);cur.setDate(1);
  }
  const sorted=sortTasks(active);
  let rowsHtml='';
  sorted.forEach(task=>{
    const overdue=isOverdue(task);
    const sp=task.inmediata&&!task.fechaInicio?pct(todayStr):pct(task.fechaInicio||todayStr);
    const ep=task.fechaLimite?pct(task.fechaLimite):sp+2;
    const bc=task.inmediata&&!task.fechaLimite?'inmediata':overdue?'overdue':'normal';
    rowsHtml+=`<div class="gantt-row">
      <div class="gantt-label${overdue?' overdue':''}" title="${task.text}">${task.inmediata?'⚡ ':''}${task.text}</div>
      <div class="gantt-bar-wrap">
        <div class="gantt-today" style="left:${todayPct}%"></div>
        <div class="gantt-bar ${bc}" style="left:${sp}%;width:${Math.max(ep-sp,2)}%"></div>
        ${overdue?`<div style="font-size:10px;color:var(--red);margin-top:2px">⚠ Vencida el ${fmtDate(task.fechaLimite)}</div>`:''}
      </div>
    </div>`;
  });
  wrap.innerHTML=`<div class="gantt-table"><div class="gantt-months">${monthsHtml}</div>${rowsHtml}</div>
  <p style="font-size:11px;color:var(--text3);margin-top:12px">Línea vertical = hoy · Naranja = Inmediata · Verde = Con fecha · Rojo = Vencida</p>`;
}

function updateProgress(){
  const total=tasks.length,done=tasks.filter(t=>t.done).length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progLabel').textContent=`${done} / ${total} completadas`;
}

function renderAll(){renderFilters();renderCatSelects();renderTasks();renderDone();renderGantt();}

});
document.getElementById('editModal').addEventListener('click',e=>{
  if(e.target===document.getElementById('editModal'))document.getElementById('editModal').classList.remove('open');
});

document.getElementById('deleteTaskBtn').addEventListener('click',()=>{
  const task=tasks.find(t=>t.id===editingId);if(!task)return;
  if(!confirm(`¿Eliminar "${task.text}"?`))return;
  tasks=tasks.filter(t=>t.id!==editingId);
  saveData('eliminada: '+task.text);
  document.getElementById('editModal').classList.remove('open');
  renderAll();
});

document.getElementById('editDelAdjunto').addEventListener('click',()=>{
  const task=tasks.find(t=>t.id===editingId);if(!task)return;
  task.adjunto=null;
  document.getElementById('editAttachName').textContent='Sin adjunto';
  document.getElementById('editDelAdjunto').style.display='none';
  saveData('adjunto eliminado: '+task.text);renderAll();
});

document.getElementById('editAttachBtn').addEventListener('click',()=>{
  document.getElementById('editFileInput').click();
});
document.getElementById('editFileInput').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;
  const task=tasks.find(t=>t.id===editingId);if(!task)return;
  const btn=document.getElementById('editAttachBtn');
  const nameEl=document.getElementById('editAttachName');
  await uploadFile(file,(adj)=>{
    task.adjunto=adj;
    nameEl.textContent=adj.name;
    document.getElementById('editDelAdjunto').style.display='';
    btn.textContent='📎 Cambiar archivo';
    saveData('adjunto: '+task.text);renderAll();
  },null,btn,nameEl);
  e.target.value='';
});

document.getElementById('saveEditBtn').addEventListener('click',()=>{
  const task=tasks.find(t=>t.id===editingId);if(!task)return;
  const inmediata=document.getElementById('editInmediata').checked;
  const fechaLimite=document.getElementById('editFechaLimite').value;
  if(!inmediata&&!fechaLimite){alert('Agregá una fecha límite o marcá como Inmediata.');return;}
  task.text=document.getElementById('editText').value.trim()||task.text;
  task.cat=document.getElementById('editCat').value;
  task.assign=document.getElementById('editAssign').value;
  task.inmediata=inmediata;
  task.fechaInicio=inmediata?today():(document.getElementById('editFechaInicio').value||today());
  task.fechaLimite=fechaLimite;
  task.notes=document.getElementById('editNotes').value.trim();
  saveData('editada: '+task.text);
  document.getElementById('editModal').classList.remove('open');
  renderAll();
});

// ── Drag & drop desktop ────────────────────────────────────────────────────
function addDragEvents(li,task){
  li.addEventListener('dragstart',e=>{window._dragId=task.id;setTimeout(()=>li.classList.add('dragging'),0);e.dataTransfer.effectAllowed='move';});
  li.addEventListener('dragend',()=>li.classList.remove('dragging'));
  li.addEventListener('dragover',e=>{e.preventDefault();document.querySelectorAll('.task-item').forEach(x=>x.classList.remove('drag-over'));li.classList.add('drag-over');});
  li.addEventListener('dragleave',()=>li.classList.remove('drag-over'));
  li.addEventListener('drop',e=>{
    e.preventDefault();li.classList.remove('drag-over');
    const srcId=window._dragId;if(!srcId||srcId===task.id)return;
    const fi=tasks.findIndex(t=>t.id===srcId),ti=tasks.findIndex(t=>t.id===task.id);
    if(fi<0||ti<0)return;
    tasks.splice(ti,0,tasks.splice(fi,1)[0]);
    window._dragId=null;saveData('reordenamiento');renderAll();
  });
}

// ── Touch drag & drop móvil (long press) ──────────────────────────────────
function addTouchEvents(li,task){
  let clone=null,startX=0,startY=0,timer=null,dragging=false;
  li.addEventListener('touchstart',e=>{
    if(e.target.classList.contains('cb')||e.target.closest('.icon-btn')||e.target.closest('.task-notes'))return;
    startX=e.touches[0].clientX;startY=e.touches[0].clientY;
    timer=setTimeout(()=>{
      dragging=true;
      if(navigator.vibrate)navigator.vibrate(40);
      const rect=li.getBoundingClientRect();
      clone=li.cloneNode(true);
      clone.style.cssText=`position:fixed;opacity:.8;pointer-events:none;z-index:999;width:${rect.width}px;left:${rect.left}px;top:${rect.top}px;margin:0;box-shadow:0 8px 24px rgba(0,0,0,.18);border-radius:10px;`;
      document.body.appendChild(clone);li.style.opacity='.3';
    },500);
  },{passive:true});
  li.addEventListener('touchmove',e=>{
    if(!dragging){
      if(Math.abs(e.touches[0].clientX-startX)>8||Math.abs(e.touches[0].clientY-startY)>8){clearTimeout(timer);timer=null;}
      return;
    }
    e.preventDefault();
    const dy=e.touches[0].clientY-startY;
    clone.style.top=(li.getBoundingClientRect().top+dy)+'px';
    document.querySelectorAll('.task-item').forEach(x=>x.classList.remove('drag-over'));
    const els=document.elementsFromPoint(e.touches[0].clientX,e.touches[0].clientY);
    const target=els.find(el=>el.classList&&el.classList.contains('task-item')&&el!==li);
    if(target)target.classList.add('drag-over');
  },{passive:false});
  li.addEventListener('touchend',e=>{
    clearTimeout(timer);timer=null;
    if(!dragging)return;
    dragging=false;clone.remove();clone=null;li.style.opacity='';
    document.querySelectorAll('.task-item').forEach(x=>x.classList.remove('drag-over'));
    const els=document.elementsFromPoint(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
    const target=els.find(el=>el.classList&&el.classList.contains('task-item')&&el!==li);
    if(target){
      const fi=tasks.findIndex(t=>t.id===task.id),ti=tasks.findIndex(t=>t.id===target.dataset.id);
      if(fi>=0&&ti>=0){tasks.splice(ti,0,tasks.splice(fi,1)[0]);saveData('reordenamiento');renderAll();}
    }
  });
  li.addEventListener('touchcancel',()=>{clearTimeout(timer);timer=null;dragging=false;if(clone){clone.remove();clone=null;}li.style.opacity='';});
}

// ── Modal categorías ───────────────────────────────────────────────────────
function openCatModal(){
  const el=document.getElementById('catListEdit');el.innerHTML='';
  cats.forEach(c=>{
    const row=document.createElement('div');row.className='cat-row-edit';row.dataset.id=c.id;
    row.innerHTML=`<input type="color" value="${c.bg}"><input type="text" value="${c.label}" placeholder="Nombre"><button data-role="del" style="background:none;border:none;cursor:pointer;color:#aaa;font-size:16px">✕</button>`;
    row.querySelector('[data-role=del]').addEventListener('click',()=>row.remove());
    el.appendChild(row);
  });
  document.getElementById('catModal').classList.add('open');
}
function closeCatModal(){document.getElementById('catModal').classList.remove('open');}
document.getElementById('editCatsBtn').addEventListener('click',openCatModal);
document.getElementById('cancelCatBtn').addEventListener('click',closeCatModal);
document.getElementById('catModal').addEventListener('click',e=>{if(e.target===document.getElementById('catModal'))closeCatModal();});
document.getElementById('addCatRowBtn').addEventListener('click',()=>{
  const el=document.getElementById('catListEdit');
  const row=document.createElement('div');row.className='cat-row-edit';row.dataset.id='cat_'+uid();
  row.innerHTML=`<input type="color" value="#e8e5fe"><input type="text" placeholder="Nombre"><button data-role="del" style="background:none;border:none;cursor:pointer;color:#aaa;font-size:16px">✕</button>`;
  row.querySelector('[data-role=del]').addEventListener('click',()=>row.remove());
  el.appendChild(row);row.querySelector('input[type=text]').focus();
});
document.getElementById('saveCatsBtn').addEventListener('click',()=>{
  const rows=document.querySelectorAll('#catListEdit .cat-row-edit');const nc=[];
  rows.forEach(row=>{
    const label=row.querySelector('input[type=text]').value.trim();if(!label)return;
    const bg=row.querySelector('input[type=color]').value;const id=row.dataset.id;
    const r=parseInt(bg.slice(1,3),16),g=parseInt(bg.slice(3,5),16),b=parseInt(bg.slice(5,7),16);
    nc.push({id,label,bg,text:(0.299*r+0.587*g+0.114*b)>160?'#1a1a1a':'#f5f5f5'});
  });
  if(!nc.length)return;cats=nc;saveData('categorías');closeCatModal();renderAll();
});
</script>
